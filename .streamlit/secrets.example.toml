# AI reading settings: a template. To use it, make a copy named secrets.toml in this
# same folder and paste your key there. secrets.toml is listed in .gitignore and is never
# uploaded to GitHub; this example file is. On Streamlit Community Cloud, paste the text
# into the app's Settings -> Secrets instead.
#
# Paste ONE API key between the quotes. Leave the others empty.
# With no key, the app uses a local Ollama model if Ollama is running, or hides the AI reading.

# Gemini's free tier needs no credit card. It allows about 20 requests a day on
# gemini-3.5-flash (a reading uses 1-2); after that the app moves to the lite models, which
# have their own allowances. Limits reset at midnight Pacific time. On the free tier Google
# may use what is sent to improve its products. See your limits at
# https://aistudio.google.com/rate-limit

[ai]
gemini_api_key = ""       # free tier: https://aistudio.google.com/apikey
groq_api_key = ""         # free tier: https://console.groq.com/keys
anthropic_api_key = ""    # paid: https://platform.claude.com

# Optional
provider = ""             # force one: "gemini", "groq", "anthropic" or "ollama"; empty = automatic
model = ""                # override the model, e.g. "claude-haiku-5-5"; empty = the default
ollama_model = ""        # local model; empty = the best one installed (qwen3:14b first)
